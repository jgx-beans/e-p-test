<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Security | Jagex</title>
    <style>
      @import url("https://use.typekit.net/lkn6vut.css");
      @import url("https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap");

      :root {
        --gold: #ffda89;
        --gold-dark: #bd8200;
        --cream: #ded3b7;
        --white: #f2f4f4;
        --silver: #272727;
        --charcoal: #1a1a1a;
        --brown: #ac7954;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-width: 320px;
        color: var(--white);
        font-family: "Sofia Sans", Arial, sans-serif;
        font-size: 20px;
        line-height: 1.45;
        background: var(--silver);
      }

      .page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 32px;
      }

      .waiting-room {
        width: min(100%, 560px);
        margin: auto;
        padding: 48px;
        background: linear-gradient(180deg, rgb(39 39 39 / 96%) 0%, rgb(26 26 26 / 96%) 100%);
        box-shadow: 0 4px 24px rgb(0 0 0 / 45%);
        text-align: center;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        background-clip: text;
        background-image: linear-gradient(180deg, var(--gold) 0%, var(--brown) 100%);
        font-family: "trajan-sans-pro", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.015em;
        line-height: 1.75rem;
        text-transform: uppercase;
        -webkit-text-fill-color: transparent;
      }

      h2 {
        margin-top: 20px;
        color: var(--white);
        font-family: inherit;
        font-size: 1em;
        font-weight: 700;
        line-height: 1.35;
      }

      .content-divider {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 20px;
      }

      .brand-logo {
        display: block;
        margin-inline: auto;
        width: min(14rem, 100%);
        height: auto;
      }

      .content-divider + h1 {
        margin-top: 32px;
      }

      .content-divider__line {
        flex-grow: 1;
        height: 1px;
        background: #ffda89;
      }

      .content-divider__diamond {
        width: 9px;
        height: 9px;
        margin: 0 -1px;
        z-index: 2;
      }

      .content-divider__star {
        width: 17px;
        height: 17px;
        margin: 0 -1px;
        z-index: 2;
      }

      .body-copy {
        margin-top: 20px;
        color: var(--white);
        font-size: 18px;
      }

      .queue-copy {
        font-size: 20px;
      }

      .last-updated {
        font-size: 16px;
      }

      .queue-status {
        display: flow-root;
        margin-top: 20px;
        padding: 0 16px 16px;
        background: #272727;
        border-radius: 10px;
      }

      .turnstile {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      @media (max-width: 600px) {
        .page {
          padding: 20px;
        }

        .waiting-room {
          margin: auto;
          padding: 36px 24px;
        }
      }

      @media (min-width: 608px) {
        .waiting-room {
          border: 1px solid;
          border-image-source: linear-gradient(
            339deg,
            #373737 16.45%,
            var(--brown) 31.76%,
            var(--gold) 58.03%
          );
          border-image-slice: 1;
        }
      }
    </style>
  </head>
